name: docgen

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      # owner role: migrations only. app role: runtime, subject to RLS.
      MIGRATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docgen}
      DATABASE_URL: postgresql+psycopg://docgen_app:${APP_DB_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-docgen}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_PRESET: ${SMTP_PRESET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      SMTP_AUTH: ${SMTP_AUTH:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-}
      SMTP_VERIFY_TLS: ${SMTP_VERIFY_TLS:-}
      SMTP_CA_BUNDLE: ${SMTP_CA_BUNDLE:-}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-}
      SMTP_OAUTH_TENANT_ID: ${SMTP_OAUTH_TENANT_ID:-}
      SMTP_OAUTH_CLIENT_ID: ${SMTP_OAUTH_CLIENT_ID:-}
      SMTP_OAUTH_CLIENT_SECRET: ${SMTP_OAUTH_CLIENT_SECRET:-}
      AUTH_MODE: ${AUTH_MODE:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_VERIFY_TLS: ${OIDC_VERIFY_TLS:-}
      OIDC_CA_BUNDLE: ${OIDC_CA_BUNDLE:-}
      OIDC_END_SESSION: ${OIDC_END_SESSION:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}  # ignored (warns when 0)
      OIDC_ROLES_CLIENT_ID: ${OIDC_ROLES_CLIENT_ID:-}
      OIDC_REALM_ROLES: ${OIDC_REALM_ROLES:-}
      OIDC_ROLE_PREFIX: ${OIDC_ROLE_PREFIX:-}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-}
      OIDC_DEFAULT_ORG: ${OIDC_DEFAULT_ORG:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}
      LOCK_HEARTBEAT_TTL_S: ${LOCK_HEARTBEAT_TTL_S:-}
      LOCK_REQUEST_TIMEOUT_S: ${LOCK_REQUEST_TIMEOUT_S:-}
      LOCK_REQUEST_COOLDOWN_S: ${LOCK_REQUEST_COOLDOWN_S:-}
      PDF_URL: http://pdf:3000
      SEED_DEMO: ${SEED_DEMO:-0}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
    # ./certs (gitignored) holds private CA bundles: OIDC_CA_BUNDLE=/certs/company-ca.pem, SMTP_CA_BUNDLE likewise
    volumes: [repos:/repos, files:/files, "./certs:/certs:ro"]
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      retries: 20

  # `make test-e2e-docker`: Playwright against the running stack through the compose network.
  e2e:
    profiles: [e2e]
    build: {context: ., dockerfile: e2e/Dockerfile}
    user: "${E2E_UID:-1000}"
    environment:
      E2E_BASE_URL: http://web
      MAIL_URL: http://mail:8025
      E2E_ARTIFACTS: /artifacts
      E2E_TAG: ${E2E_TAG:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      IDP_URL: http://idp:9000
    volumes: ["./e2e-artifacts:/artifacts"]
    depends_on:
      web: {condition: service_healthy}
    command: ["sh", "-c", "for t in smoke docbuilder import invite fidelity basedoc editor round7 tables round9 round12 round13 round14 round15 locks; do python $$t.py || exit 1; done"]

  # `make test-e2e-oidc`: test OpenID Provider (tests/mock_idp.py), never part of a normal `up`.
  idp:
    profiles: [oidc-test]
    build: ./backend
    command: ["python", "-m", "tests.mock_idp", "--port", "9000", "--issuer", "http://idp:9000"]
    environment:
      OIDC_CLIENT_ID: docgen
      OIDC_CLIENT_SECRET: mock-secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/.well-known/openid-configuration')"]
      interval: 2s
      retries: 20

  pdf:
    image: gotenberg/gotenberg:8

  mail:
    image: axllent/mailpit
    ports: ["${MAIL_UI_PORT:-8025}:8025"]

volumes:
  pgdata:
  repos:
  files:
