name: docgen

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docgen}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      # owner role: migrations only. app role: runtime, subject to RLS.
      MIGRATE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docgen}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docgen}
      DATABASE_URL: postgresql+psycopg://docgen_app:${APP_DB_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-docgen}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-DocGen <noreply@docgen.local>}
      PDF_URL: http://pdf:3000
      SEED_DEMO: ${SEED_DEMO:-0}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
    volumes: [repos:/repos, files:/files]
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      retries: 20

  # `make test-e2e-docker`: Playwright against the running stack through the compose network.
  e2e:
    profiles: [e2e]
    build: {context: ., dockerfile: e2e/Dockerfile}
    user: "${E2E_UID:-1000}"
    environment:
      E2E_BASE_URL: http://web
      MAIL_URL: http://mail:8025
      E2E_ARTIFACTS: /artifacts
      E2E_TAG: ${E2E_TAG:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
    volumes: ["./e2e-artifacts:/artifacts"]
    depends_on:
      web: {condition: service_healthy}
    command: ["sh", "-c", "for t in smoke docbuilder import invite fidelity basedoc; do python $$t.py || exit 1; done"]

  pdf:
    image: gotenberg/gotenberg:8

  mail:
    image: axllent/mailpit
    ports: ["${MAIL_UI_PORT:-8025}:8025"]

volumes:
  pgdata:
  repos:
  files:
