server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  resolver 127.0.0.11 valid=5s;  # Docker DNS: re-resolve `api` so a recreated api container is found (no stale 502)
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # index.html names the hashed bundle: without no-cache a browser/proxy may reuse an old copy and run the previous build
  # until a manual reload (the "first load shows the old behaviour" symptom); /assets/* are content-hashed.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
